services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - TZ=Africa/Casablanca     # heure locale affichee sur le tableau de bord
      - SILENCE_THRESHOLD_S=20   # chien de garde : silence max avant alerte S02
      - RENOTIFY_S=60            # rappel d'une alerte qui persiste
      - CLEAR_N=2                # lectures normales consecutives pour lever une alerte
    volumes:
      - ./nodered:/data
      - ./results:/results
    depends_on:
      - mosquitto
    restart: unless-stopped